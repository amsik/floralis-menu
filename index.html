<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Floralis — Bouquets for February 14th</title>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="preconnect" href="https://storage.googleapis.com"/>

</head>
<body>
<header>
  <h1>Floralis</h1>
  <p>Bouquets for February 14th</p>
</header>

<section class="category">
  <h2 class="category-title">Mixed</h2>
  <div class="bouquet-grid" id="mixes-grid"></div>
</section>

<section class="category">
  <h2 class="category-title">Boxes</h2>
  <div class="bouquet-grid" id="boxes-grid"></div>
</section>

<section class="category">
  <h2 class="category-title">Mono</h2>
  <div class="bouquet-grid" id="mono-grid"></div>
</section>

<section class="category">
  <h2 class="category-title">Tulips</h2>
  <div class="bouquet-grid">
    <article class="card">
      <div class="card-image-wrap">
        <img
            src="https://storage.googleapis.com/floralis/14-feb/mix_1.jpeg"
            alt="Dutch Classic bouquet"
            loading="lazy"
        />
      </div>
      <div class="card-body">
        <h3 class="card-title">Dutch Classic</h3>
        <div class="sizes">
          <div class="size-option"><span class="label">S</span><span class="price">€28</span></div>
          <div class="size-option"><span class="label">M</span><span class="price">€45</span></div>
          <div class="size-option"><span class="label">L</span><span class="price">€62</span></div>
          <div class="size-option"><span class="label">XL</span><span class="price">€82</span></div>
        </div>
      </div>
    </article>
    <article class="card">
      <div class="card-image-wrap">
        <img
            src="https://storage.googleapis.com/floralis/14-feb/mix_1.jpeg"
            alt="Spring Pastel bouquet"
            loading="lazy"
        />
      </div>
      <div class="card-body">
        <h3 class="card-title">Spring Pastel</h3>
        <div class="sizes">
          <div class="size-option"><span class="label">S</span><span class="price">€31</span></div>
          <div class="size-option"><span class="label">M</span><span class="price">€50</span></div>
          <div class="size-option"><span class="label">L</span><span class="price">€70</span></div>
          <div class="size-option"><span class="label">XL</span><span class="price">€90</span></div>
        </div>
      </div>
    </article>
    <article class="card">
      <div class="card-image-wrap">
        <img
            src="https://storage.googleapis.com/floralis/14-feb/mix_1.jpeg"
            alt="Tulip Romance bouquet"
            loading="lazy"
        />
      </div>
      <div class="card-body">
        <h3 class="card-title">Tulip Romance</h3>
        <div class="sizes">
          <div class="size-option"><span class="label">S</span><span class="price">€34</span></div>
          <div class="size-option"><span class="label">M</span><span class="price">€54</span></div>
          <div class="size-option"><span class="label">L</span><span class="price">€74</span></div>
          <div class="size-option"><span class="label">XL</span><span class="price">€94</span></div>
        </div>
      </div>
    </article>
  </div>
</section>

<script src="main.js"></script>
</body>
</html>
